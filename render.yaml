# Single-service deployment: API + React dashboard + graph-walk scheduler
# in one process.

databases:
  - name: pump-scanner-db
    plan: basic-256mb
    databaseName: pump_scanner
    user: scanner

services:
  - type: web
    name: pump-scanner-web
    runtime: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pump-scanner-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: GMGN_API_KEY
        sync: false
      - key: BIRDEYE_API_KEY
        sync: false
    healthCheckPath: /api/health
