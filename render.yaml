databases:
  - name: pump-scanner-db
    plan: starter
    databaseName: pump_scanner
    user: scanner

services:
  # FastAPI Web Service (serves API + React frontend)
  - type: web
    name: pump-scanner-web
    runtime: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pump-scanner-db
          property: connectionString
      - key: BSCSCAN_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ARKHAM_API_KEY
        sync: false
    healthCheckPath: /api/health

  # Background Worker (runs all scanners)
  - type: worker
    name: pump-scanner-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pump-scanner-db
          property: connectionString
      - key: BSCSCAN_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ARKHAM_API_KEY
        sync: false
