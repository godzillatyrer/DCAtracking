# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the CLOCKIN launch sniper as a Background Worker with a small
# persistent disk so state.json (alert dedupe, candidate factories,
# baselines) survives restarts and redeploys.
#
# Compute: $7/mo (starter instance) + $0.25/mo (1 GB disk). Per-service
# compute is billed on top of your workspace plan, not included in it.
# Background workers have NO free instance type, and free web services
# cannot mount disks — see README "Deploying on Render" for the free
# workaround and its (significant) caveats.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# You'll be prompted for TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
#
# No `branch:` is set, so Render deploys this repo's default branch and
# keeps following it if the default is ever renamed. Add `branch: <name>`
# to pin a specific one.

services:
  - type: worker
    name: stonk-watcher
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python watcher.py
    autoDeployTrigger: commit

    disk:
      name: watcher-state
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Persist state on the mounted disk, NOT the ephemeral filesystem.
      - key: STATE_FILE
        value: /var/data/state.json

      # Prompted for at deploy time; never committed.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

      # T0 = Stonk Launcher go-live (Tue Aug 11, 8:00 PM EST).
      - key: T0_UTC
        value: "2026-08-12T00:00:00Z"

      # Render restarts are invisible from your phone otherwise; keep the
      # heartbeat frequent enough that silence is noticeable before T0.
      - key: HEARTBEAT_HOURS
        value: "6"

      # Optional — set in the dashboard if you have them.
      - key: RPC_URL
        sync: false
      - key: AMM_FACTORY_ADDRESS
        sync: false
