<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="description" content="PumpScanner — on-chain detection for BSC & Solana" />
  <title>PumpScanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0b0d12;
      color: #f5f7fa;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-feature-settings: 'ss01', 'ss02', 'cv01', 'cv02';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0b0d12; }
    ::-webkit-scrollbar-thumb { background: #2a2e3a; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3f4c; }
    /* Input placeholder */
    input::placeholder, textarea::placeholder { color: #5e6675; }
    /* Anchor reset */
    a { color: inherit; text-decoration: none; }
    /* Button reset */
    button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
