<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="description" content="PumpScanner — on-chain detection for BSC & Solana" />
  <title>PumpScanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #f5f5f7;
      color: #1d1d1f;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      font-size: 15px;
      font-feature-settings: 'ss01', 'cv11';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    /* Scrollbar — thin + subtle */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #d2d2d7;
      border-radius: 5px;
      border: 2px solid #f5f5f7;
    }
    ::-webkit-scrollbar-thumb:hover { background: #86868b; }
    /* Input placeholder */
    input::placeholder, textarea::placeholder { color: #86868b; }
    /* Button focus ring */
    button:focus-visible, input:focus-visible {
      outline: 2px solid #0066ff;
      outline-offset: 2px;
    }
    /* Anchor reset */
    a { color: inherit; text-decoration: none; }
    /* Button reset */
    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: translateY(1px); }
    /* Table row hover */
    tbody tr { transition: background-color 0.12s; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
